<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printo</title>
    <link rel="icon" type="image/x-icon" href="../lib/doro-favicon/favicon.ico">
    <style>
        html,body{
            margin: 0;
            padding: 0;
        }

        #tip{
            font-family: "Source Han Sans CN", sans-serif;
            font-size: larger;
            text-align: center;
            font-weight: 400;
        }

        .container{
            /* border: 1px gray solid; */
            width: 40%;
            margin-left: 30%;
            
            
        }

        #show_box{
            width: 100%;
            height: 300px;
            border: 1px rgb(216, 212, 212) solid;
            margin-top: 2%;
        }

        button{
            /* border: none; */
            /* border-radius: 999px; */
        }

        #start_up{
            background-color: #F8D7DD;
            width: 100%;
            height: 48px;
            border-radius: 999px;
            border: none;
            margin-bottom: 5%;            
        }

        #start_up:hover {
            background-color: #F2BECB;
        }

        #choose_folder{
           
           margin-left: 48%;
           background-color: rgb(244, 228, 223)
            
        }

        #clear_list{
            /* margin-left: 44%; */
        }

        .file_list{
            font-weight:500;
            font-size: large;
        }
        #donate{
            border: 0 none;
            background-color: white;
            font-size: 14px;
            cursor: pointer;
            margin-left: 45%;
        }
        

    </style>
</head>
<body>
    <h4 id="tip">注意：选择好打印文件夹后，程序将打印这个文件夹内的所有文件。</h4>
    <div class="container">
        <button id="choose_folder">选择打印文件夹</button>
        <button id="clear_list">清空打印文件</button>
        <span class="file_list">待打印文件列表：</span>
        <br>
        <div id="show_box"></div><br>
        <button id="start_up">开始打印</button>
        <button id="donate">打赏</button>
    </div>
    
</body>

<script>
    // 等待pywebview初始化完成
    var path = ""
    var file_list;
    window.addEventListener('pywebviewready', () => {
        // console.log(window.pywebview.api); // 控制台能看到 select_folder 等方法，即为绑定成功
        const api = window.pywebview.api;
        const folderBtn = document.getElementById('choose_folder');
        folderBtn.onclick = async() => {
            path = await api.select_folder();
            file_list = await api.get_print_file_list();
            showFilesInBox(file_list)
        }

        const launchBtn = document.getElementById('start_up')
        launchBtn.onclick = async() => {
            alert('打印中，请稍等...')
            if (await api.start_batch_print()){
                alert(await api.getBatchPrinterRunningInfo())
                clearBtn.click();
            }
            // else{
            //     alert('打印失败！请检查是否选择了存在打印文件的文件夹。')
            // }
                
        } 
        
        const clearBtn = document.getElementById('clear_list');
        clearBtn.onclick = async() => {
            clear();
            await api.delete_temp_pdf_dir();
        }

        const donateBtn = document.getElementById('donate');
        donateBtn.onclick = async() => {
            await api.create_donate_window()
        }



    })

    var box = document.getElementById('show_box')
    function showFilesInBox(strArr){
        if (strArr.length === 0) {
            alert("请选择存在可打印文件的文件夹~");
            return;
        }
        var text = ""
        for( var i = 0;i<strArr.length;i++){
            var sum = i+1;
            text += "待打印文件"+ sum +"： "+strArr[i] + "；  "
        }
        box.innerText = text
    }


    function clear(){
        box.innerText = "";
        file_list = [];
        path = "";
    }



</script>


</html>
